***REMOVED*** OIDC via Pocket-ID (https://id.example.com); client secret injected from
***REMOVED*** Secret grafana-oidc via envValueFrom below. Local admin login stays enabled.
grafana.ini:
  server:
    root_url: https://grafana.example.com/
  auth.generic_oauth:
    enabled: true
    name: Pocket ID
    client_id: grafana
    scopes: openid profile email groups
    auth_url: https://id.example.com/authorize
    token_url: https://id.example.com/api/oidc/token
    api_url: https://id.example.com/api/oidc/userinfo
    role_attribute_path: "contains(groups[*], 'admins') && 'Admin' || 'Viewer'"
    allow_sign_up: true

envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oidc
      key: client-secret

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

admin:
  existingSecret: grafana-admin

persistence:
  type: pvc
  enabled: true
  storageClassName: storage-fast
  size: 10Gi

***REMOVED*** RWO PVC + RollingUpdate = deadlock (new pod waits attach, old never
***REMOVED*** terminates) — must be Recreate.
deploymentStrategy:
  type: Recreate

plugins:
  - grafana-clock-panel
  - victoriametrics-logs-datasource

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        url: http://vmsingle-victoria-metrics.observability.svc:8429
        access: proxy
        isDefault: true
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        url: http://vlsingle-victoria-logs.observability.svc:9428
        access: proxy

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: observability
    ***REMOVED*** Group dashboards into folders: a ConfigMap carrying the `grafana_folder`
    ***REMOVED*** annotation lands in that folder; otherwise it falls back to "General".
    folderAnnotation: grafana_folder
    defaultFolderName: General
    ***REMOVED*** REQUIRED with folderAnnotation: the sidecar encodes the folder as a
    ***REMOVED*** subdirectory of defaultFolderName; the provider must replicate that
    ***REMOVED*** structure as folders, else every dashboard lands top-level.
    provider:
      foldersFromFilesStructure: true
