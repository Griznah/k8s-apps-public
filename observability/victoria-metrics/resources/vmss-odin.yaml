apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: storage-host
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  jobName: storage-host
  ***REMOVED*** NFS/media server `storage` = 10.0.10.200 (mgmt VLAN, same as storage-2-host).
  ***REMOVED*** NOTE 10.0.4.205 is an LXC container (runs the storage grafana/dashboards
  ***REMOVED*** stack) — NOT storage; don't point scrapes at it.
  ***REMOVED*** Feeds the `Local` grafana folder (ops-dashboards CM): Linux Hosts /
  ***REMOVED*** Odin Hosts / Storage I/O. `Odin drive stuff` stays empty until
  ***REMOVED*** smartmon textfile collector is set up on storage.
  targetEndpoints:
    - targets:
        - 10.0.10.200:9100
      labels:
        node: storage
        role: nfs-media-server
