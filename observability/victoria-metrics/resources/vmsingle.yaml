apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: victoria-metrics
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ***REMOVED*** Bare number = months (operator convention; matches the VMSingle docs example "12").
  retentionPeriod: "6"
  removePvcAfterDelete: true
  storage:
    storageClassName: storage-fast
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
***REMOVED*** VMSingle has no built-in auth: exposed ONLY via internal hostname
***REMOVED*** vmui.k8s.example.com (resources/vmui-gateway-route.yaml, no bare
***REMOVED*** example.com) — LAN-only tradeoff. Do not add the external hostname.
