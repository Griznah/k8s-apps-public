apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: victoria-metrics
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ***REMOVED*** Bare number = months (operator convention; matches the VMSingle docs example "12").
  ***REMOVED*** 2026-11-26: 6→3 — VM went read-only at 100% disk (19.5G/20Gi, writes dropped since
  ***REMOVED*** 2026-11-12). Cut + PVC expansion 20→30Gi per incident post-mortem.
  retentionPeriod: "3"
  removePvcAfterDelete: true
  storage:
    storageClassName: storage-fast
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 30Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
***REMOVED*** VMSingle has no built-in auth: exposed ONLY via internal hostname
***REMOVED*** vmui.k8s.example.com (resources/vmui-gateway-route.yaml, no bare
***REMOVED*** example.com) — LAN-only tradeoff. Do not add the external hostname.
