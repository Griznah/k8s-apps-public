apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicas: 1
  strategy:
    type: Recreate ***REMOVED*** RWO config PVC
  selector:
    matchLabels:
      app: copyparty
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config
      labels:
        name: copyparty
        app: copyparty
        part-of: div
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copyparty
          image: copyparty-image ***REMOVED*** controlled by Kustomize
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - name: http
              containerPort: 3923
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /cfg
            - name: config-file
              mountPath: /cfg/copyparty.conf
              subPath: copyparty.conf
              readOnly: true
            ***REMOVED*** storage media shares, read-only (browse/download only)
            - name: nfs-storage-media-series
              mountPath: /srv/media/Series
              readOnly: true
            - name: nfs-storage-media-movies
              mountPath: /srv/media/HD_Movies
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: copyparty-config
        - name: config-file
          secret:
            secretName: copyparty
            items:
              - key: config
                path: copyparty.conf
        - name: nfs-storage-media-series
          nfs:
            path: /sxtnpool/files/media/Series
            server: 10.0.250.200
            readOnly: true
        - name: nfs-storage-media-movies
          nfs:
            path: /sxtnpool/files/media/HD_Movies
            server: 10.0.250.200
            readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: copyparty-config
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "storage-fast"
  resources:
    requests:
      storage: 1Gi
