apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  ***REMOVED*** no sync-wave: WFC StorageClass + higher-wave Deployment deadlocks ArgoCD
  ***REMOVED*** (PVC waits for consumer, Deployment waits for PVC healthy)
spec:
  replicas: 1 ***REMOVED*** SQLite (cache.db, user.db) is single-writer; never scale
  strategy:
    type: Recreate ***REMOVED*** RWO cache PVC
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: cache ***REMOVED*** cache.db + user.db (auth users)
      labels:
        name: ntfy
        app: ntfy
        part-of: div
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy
          image: ntfy-image ***REMOVED*** controlled by Kustomize
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args: ["serve"] ***REMOVED*** config: /etc/ntfy/server.yml (image default path)
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ntfy
            - name: config-file
              mountPath: /etc/ntfy/server.yml
              subPath: server.yml
              readOnly: true
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: ntfy-cache
        - name: config-file
          secret:
            secretName: ntfy
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "storage-fast"
  resources:
    requests:
      storage: 1Gi
