apiVersion: v1
kind: Service
metadata:
  name: absa-ac-headless
  namespace: absa-ac
spec:
  clusterIP: None
  selector:
    app: absa-ac
---
apiVersion: v1
kind: Service
metadata:
  name: absa-ac
  namespace: absa-ac
spec:
  selector:
    app: absa-ac
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
