apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - resources/wowmin-namespace.yaml
  - resources/wowmin-pvc.yaml
  - resources/wowmin-deployment.yaml
  - resources/wowmin-service.yaml
  - resources/wowmin-gateway-route.yaml

generators:
  - ksops.yaml

generatorOptions:
  disableNameSuffixHash: true

namespace: wowmin

images:
  - name: wowmin-image
    newName: ghcr.io/example/wowmin
    newTag: 3.1.0@sha256:ddcaea0f9057971e9ea97f21808bde5850bb6076b49f055b33a109d47e15e729
