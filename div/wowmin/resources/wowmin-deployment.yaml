apiVersion: apps/v1
kind: Deployment
metadata:
  name: wowmin
  ***REMOVED*** no sync-wave: WFC StorageClass + higher-wave Deployment deadlocks ArgoCD
  ***REMOVED*** (PVC waits for consumer, Deployment waits for PVC healthy)
spec:
  replicas: 1
  strategy:
    type: Recreate ***REMOVED*** RWO data PVC
  selector:
    matchLabels:
      app: wowmin
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: data
      labels:
        name: wowmin
        app: wowmin
        part-of: div
    spec:
      ***REMOVED*** Service named "wowmin" would inject WOWMIN_PORT=tcp://... env and crash the app
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 ***REMOVED*** node user in image
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wowmin
          image: wowmin-image ***REMOVED*** controlled by Kustomize
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: wowmin ***REMOVED*** WOWMIN_USERNAME / WOWMIN_PASSWORD
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          ***REMOVED*** httpGet would 401 (Basic Auth on every route); TCP is enough
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wowmin-data
