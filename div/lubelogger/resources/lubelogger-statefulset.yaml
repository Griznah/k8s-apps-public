apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lubelogger
  namespace: lubelogger
  labels:
    app: lubelogger
spec:
  serviceName: lubelogger
  replicas: 1
  selector:
    matchLabels:
      app: lubelogger
  template:
    metadata:
      labels:
        app: lubelogger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        ***REMOVED*** Seed userConfig.json (admin user/pass + UI prefs) from Secret onto the
        ***REMOVED*** PVC. Runs every boot and overwrites — userConfig is git-declarative; UI
        ***REMOVED*** edits to it are ephemeral. Vehicle DB / documents on the PVC persist.
        - name: seed-config
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - "mkdir -p /data/config && cp -f /secret/userConfig.json /data/config/userConfig.json"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: userconfig
              mountPath: /secret
              readOnly: true
      containers:
        - name: lubelogger
          image: ghcr.io/hargata/lubelogger:v1.7.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: LC_ALL
              value: en_US.UTF-8
            - name: LANG
              value: en_US.UTF-8
            - name: LOGGING__LOGLEVEL__DEFAULT
              value: Information
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /App/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lubelogger-data
        - name: userconfig
          secret:
            secretName: lubelogger
            items:
              - key: userConfig
                path: userConfig.json
