***REMOVED*** WireGuard server config, supplied via chart's `configSecretName` override so
***REMOVED*** the chart does NOT render its own wg0.conf — the chart template hardcodes an
***REMOVED*** `iptables -t nat ... MASQUERADE` PostUp that fails on Cilium
***REMOVED*** kube-proxy-replacement nodes (no iptable_nat module). This config keeps only
***REMOVED*** the `wg set ... private-key` half of PostUp; pod→LAN SNAT is handled by
***REMOVED*** Cilium (`enable-ipv4-masquerade: true`, LAN outside ipv4-native-routing-cidr).
***REMOVED*** Contents are non-secret (PublicKey values are already plaintext in values.yaml;
***REMOVED*** the actual private key lives in the separate SOPS `wireguard-wg` Secret).
apiVersion: v1
kind: Secret
metadata:
  name: wireguard-wg-config
  namespace: wireguard-system
type: Opaque
stringData:
  wg0.conf: |
    [Interface]
    Address = 10.200.0.1/24
    ListenPort = 51820
    PostUp = wg set wg0 private-key /etc/wireguard/privatekey

    ***REMOVED*** Clients
