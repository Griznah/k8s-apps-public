***REMOVED*** WireGuard server config, supplied via chart's `configSecretName` override so
***REMOVED*** the chart does NOT render its own wg0.conf (lets us pin the exact peer list).
***REMOVED*** PostUp SNATs decrypted client traffic 10.200.0.0/24 -> pod IP via iptables-nft
***REMOVED*** MASQUERADE INSIDE the pod netns, so egressing packets carry the pod's own IP
***REMOVED*** and pass Cilium's endpoint source-IP validation. Without this, Cilium drops
***REMOVED*** every client packet with "Invalid source ip" (src=client tunnel IP != pod IP).
***REMOVED*** Requires the container to run as root+privileged (see values.yaml
***REMOVED*** securityContext) — iptables-nft needs CAP_NET_ADMIN + uid 0. Talos kernel has
***REMOVED*** nf_tables; the legacy ip_tables module isn't needed.
***REMOVED*** Contents are non-secret (PublicKey values are already plaintext in values.yaml;
***REMOVED*** the actual private key lives in the separate SOPS `wireguard-wg` Secret).
apiVersion: v1
kind: Secret
metadata:
  name: wireguard-wg-config
  namespace: wireguard-system
type: Opaque
stringData:
  wg0.conf: |
    [Interface]
    Address = 10.200.0.1/24
    ListenPort = 51820
    PostUp = wg set wg0 private-key /etc/wireguard/privatekey && iptables -t nat -A POSTROUTING -s 10.200.0.0/24 -o eth0 -j MASQUERADE
    PostDown = iptables -t nat -D POSTROUTING -s 10.200.0.0/24 -o eth0 -j MASQUERADE

    ***REMOVED*** Clients
    [Peer]
    ***REMOVED*** friendly_name = bombom-s22
    PublicKey = 4VQkp7s05nGnIxmSyltGgQu1yOBnOgc0ZsF4q6Fp7QI=
    AllowedIPs = 10.200.0.100/32

    [Peer]
    ***REMOVED*** friendly_name = bombom-tabs4
    PublicKey = qUUrOA8Du3pqftRV8BA5/cr6RLMzJzYEg6ppotLZKlM=
    AllowedIPs = 10.200.0.101/32

    [Peer]
