apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: bifrost-lb-pool
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
***REMOVED*** General pool for all NON-gateway services (qBittorrent .202 and .208-.210 /
***REMOVED*** .212-.223 headroom). Cilium gateway services are EXCLUDED via the
***REMOVED*** serviceSelector (DoesNotExist on the owning-gateway label) so they cannot
***REMOVED*** grab these IPs; the gateway gets .211 from the dedicated pool below.
***REMOVED***
***REMOVED*** Note: .211 is deliberately omitted from this pool's blocks so no non-gateway
***REMOVED*** service can accidentally claim it.
***REMOVED*** WireGuard (.200): bryopsida chart's wg0.conf template hardcodes legacy
***REMOVED*** `iptables MASQUERADE` in PostUp, which fails on Cilium kube-proxy-replacement
***REMOVED*** nodes (iptable_nat module never loaded). Worked around by overriding
***REMOVED*** `configSecretName` with an iptables-free wg0.conf (see
***REMOVED*** wireguard-system/resources/wg-config.yaml); pod->LAN SNAT is left to Cilium.
spec:
  serviceSelector:
    matchExpressions:
      - key: io.cilium.gateway/owning-gateway
        operator: DoesNotExist
  blocks:
    - start: 10.0.50.208
      stop: 10.0.50.210
    - start: 10.0.50.212
      stop: 10.0.50.223
    ***REMOVED*** qBittorrent torrent-port LB IP (.202). Present from bootstrap so the
    ***REMOVED*** qbittorrent-tor Service can claim it.
    - cidr: 10.0.50.202/32
    ***REMOVED*** WireGuard LB IP (.200), pinned via lbipam.cilium.io/ips annotation on
    ***REMOVED*** the wireguard Service.
    - cidr: 10.0.50.200/32
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: bifrost-gateway-lb-pool
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
***REMOVED*** Dedicated pool for Cilium Gateway services only. The consolidated gateway
***REMOVED*** (Service label io.cilium.gateway/owning-gateway=<gateway-name>) matches this
***REMOVED*** pool exclusively and gets .211 deterministically — no per-Service annotation
***REMOVED*** required (Cilium does not copy Gateway -> Service annotations, so an
***REMOVED*** annotation on the Gateway would not propagate).
spec:
  serviceSelector:
    matchExpressions:
      - key: io.cilium.gateway/owning-gateway
        operator: Exists
  blocks:
    ***REMOVED*** The consolidated Gateway answers on TWO IPs: .211 (primary, the bifrost
    ***REMOVED*** gateway IP) and .201 (the original sleipnir/Traefik
    ***REMOVED*** IP, reclaimed after sleipnir retired). Both are pinned via the Gateway's
    ***REMOVED*** spec.addresses, which Cilium's gateway controller translates into a
    ***REMOVED*** lbipam.cilium.io/ips request on the auto-created Service.
    - cidr: 10.0.50.211/32
    - cidr: 10.0.50.201/32
