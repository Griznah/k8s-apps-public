{
  "apiVersion": "operator.victoriametrics.com/v1beta1",
  "kind": "VMServiceScrape",
  "metadata": {
    "name": "cilium-operator",
    "namespace": "kube-system",
    "labels": {
      "app.kubernetes.io/name": "cilium-operator"
    }
  },
  "spec": {
    "attach_metadata": {},
    "endpoints": [
      {
        "attach_metadata": {},
        "honorLabels": true,
        "interval": "10s",
        "path": "/metrics",
        "port": "metrics"
      }
    ],
    "namespaceSelector": {
      "matchNames": [
        "kube-system"
      ]
    },
    "selector": {
      "matchLabels": {
        "io.cilium/app": "operator",
        "name": "cilium-operator"
      }
    },
    "targetLabels": [
      "io.cilium/app"
    ]
  }
}
