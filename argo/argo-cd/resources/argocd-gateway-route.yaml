apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
    ***REMOVED*** Cross-namespace attach to the consolidated Gateway in namespace `gateway`.
    ***REMOVED*** The Gateway allows routes from all namespaces (allowedRoutes.namespaces.from: All).
      name: consolidated-gateway
      namespace: gateway
  hostnames:
    - argocd.k8s.example.com
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
***REMOVED*** bare host -> k8s canonical (user preference: argocd lives on .k8s. only).
***REMOVED*** OIDC callback pins to configs.cm.url (argocd.k8s.example.com).
***REMOVED*** Route NAME kept from the pre-flip layout — renaming creates a second route
***REMOVED*** on the same hostname and Cilium serves the oldest (known gotcha).
***REMOVED*** gRPC CLI host (argocd-grpc.k8s.example.com) is NOT redirected.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-k8s-canonical
  namespace: argo-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: consolidated-gateway
      namespace: gateway
  hostnames:
    - argocd.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: argocd.k8s.example.com
            statusCode: 308
