***REMOVED*** Native gRPC for the argocd CLI (`argocd login argocd.k8s.example.com`,
***REMOVED*** no --grpc-web / port-forward). Precedence: GRPCRoute handles gRPC calls
***REMOVED*** (h2, path package.Service/Method); everything else falls through to the
***REMOVED*** `argocd` HTTPRoute (UI/REST, backend h1 on port 80). Backend leg uses the
***REMOVED*** Service `https` port because that one carries appProtocol=h2c
***REMOVED*** (server.service.servicePortHttpsAppProtocol in values.yaml) — Envoy then
***REMOVED*** speaks plaintext HTTP/2 to argocd-server:8080, whose cmux serves gRPC.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: argocd-grpc
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: consolidated-gateway
      namespace: gateway
  hostnames:
    ***REMOVED*** Dedicated host: *.k8s.example.com wildcard DNS already resolves this to
    ***REMOVED*** the gateway VIP (.201) — no DNS change. Host-level split avoids the
    ***REMOVED*** route-kind precedence fight with the `argocd` HTTPRoute (older route
    ***REMOVED*** wins on overlapping hostnames; deleting/recreating to flip precedence
    ***REMOVED*** would be fragile). Cert example-net-tls covers *.k8s.example.com.
    - argocd-grpc.k8s.example.com
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: argocd-server
          port: 443
          weight: 1
