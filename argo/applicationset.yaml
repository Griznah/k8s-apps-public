apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argo
  namespace: argo-system
  annotations:
    notifications.argoproj.io/subscribe.on-app-deleted.gmail: you@example.com
    notifications.argoproj.io/subscribe.on-health-degraded.gmail: you@example.com
    notifications.argoproj.io/subscribe.on-sync-failed.gmail: you@example.com
    notifications.argoproj.io/subscribe.on-sync-status-unknown.gmail: you@example.com
  finalizers:
  - argocd.argoproj.io/resources-finalizer
spec:
  sourceRepos:
  - '*'
  destinations:
  - namespace: '*'
    server: '*'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  orphanedResources:
    warn: false
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argo
  namespace: argo-system
spec:
  generators:
  - git:
      repoURL: git@github.com:Griznah/k8s-apps.git
      revision: main
      directories:
      - path: "argo/*"
  syncPolicy:
    preserveResourcesOnDeletion: false
    applicationsSync: create-update
  template:
    metadata:
      name: "{{ path.basenameNormalized }}"
      labels:
        app-group: argo
    spec:
      project: argo
      source:
        repoURL: git@github.com:Griznah/k8s-apps.git
        targetRevision: main
        path: "{{ path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: argo-system
      revisionHistoryLimit: 5
      syncPolicy:
***REMOVED***        automated:
***REMOVED***          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
