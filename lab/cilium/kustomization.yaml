apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
***REMOVED*** Lab mirror of network/cilium — same chart, same values file (single source of
***REMOVED*** truth), adopted from the talos bootstrap Job's cilium-cli install.
***REMOVED*** Diffs vs parent kustomization: no hubble-ui gateway route (no Gateway on lab).
***REMOVED*** Chart version auto-bumped by Renovate together with the parent (kustomize manager).
helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.20.1
    releaseName: cilium
    namespace: kube-system
    valuesFile: ../../network/cilium/values.yaml
    includeCRDs: true

resources:
