apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-local
parameters:
  storage: local-lvm
  cache: writethrough
  ssd: "true"
allowVolumeExpansion: true
provisioner: csi.proxmox.sinextra.dev
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-fast
parameters:
  csi.storage.k8s.io/fstype: xfs
  storage: vmpool1
  cache: writethrough
  ssd: "true"
allowVolumeExpansion: true
mountOptions:
  - noatime
provisioner: csi.proxmox.sinextra.dev
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: proxmox-green
parameters:
  csi.storage.k8s.io/fstype: xfs
  storage: green
  cache: writethrough
  ssd: "false"
allowVolumeExpansion: true
mountOptions:
  - noatime
provisioner: csi.proxmox.sinextra.dev
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
