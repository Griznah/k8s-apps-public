apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: k8s-certs@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      ***REMOVED*** Secret resource that will be used to store the account's private key.
      name: letsencrypt-account-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token-secret
            key: api-token
      selector:
        dnsZones:
        - example.com
